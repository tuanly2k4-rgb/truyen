<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Truyện Của Tôi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdfbf7; /* Màu nền giấy ấm, chống mỏi mắt */
            --text-color: #2c2c2c; /* Chữ xám đậm, không dùng đen tuyệt đối */
            --link-color: #2a6881;
            --link-hover: #164053;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8; /* Khoảng cách dòng lớn để dễ theo dõi */
            padding: 20px;
            max-width: 720px; /* Độ rộng lý tưởng để mắt không phải lia quá xa */
            margin: 0 auto;
        }

        h1, h2, h3 {
            line-height: 1.4;
            color: #1a1a1a;
        }

        h1 {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            cursor: pointer;
            font-size: 24px;
            text-align: center;
            transition: color 0.2s;
        }

        h1:hover {
            color: var(--link-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px dashed var(--link-color);
            transition: all 0.2s ease;
        }

        a:hover {
            color: var(--link-hover);
            border-bottom: 1px solid var(--link-hover);
            background-color: rgba(42, 104, 129, 0.05);
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            font-size: 18px;
        }

        li::before {
            content: "• ";
            color: #999;
        }

        .content-box {
            margin-top: 30px;
            white-space: pre-wrap; /* Giữ nguyên xuống dòng của file txt */
            word-wrap: break-word; /* Chống tràn chữ */
            font-size: 18px; /* Cỡ chữ to dễ đọc */
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); /* Đổ bóng nhẹ tạo chiều sâu */
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 15px;
            border: none;
        }
        
        .back-btn:hover {
            background-color: transparent;
        }

        .error {
            background-color: #ffeaea;
            color: #d13c3c;
            border-left: 4px solid #d13c3c;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }

        #loading {
            text-align: center;
            font-style: italic;
            color: #777;
            padding: 20px 0;
            display: none;
        }

        @media (max-width: 600px) {
            .content-box {
                padding: 20px 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="goHome()">📚 Góc Truyện Của Tôi</h1>
        <div id="loading">Đang tải dữ liệu...</div>
    </header>

    <main id="app-container">
        <!-- Nội dung sẽ được render vào đây -->
    </main>

    <script>
        // =========================================================
        // 1. CẤU HÌNH GITHUB CỦA BẠN TẠI ĐÂY
        // =========================================================
        const GITHUB_USER = 'tuanly2k4-rgb'; // VD: 'nguyenvana'
        const GITHUB_REPO = 'truyen';   // VD: 'kho-truyen'
        // =========================================================

        const appContainer = document.getElementById('app-container');
        const loadingIndicator = document.getElementById('loading');

        function showLoading(show) {
            loadingIndicator.style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            appContainer.innerHTML = `
                <div class="error">
                    <strong>Không thể tải dữ liệu:</strong> ${message}<br><br>
                    <i>Hướng dẫn: Hãy chắc chắn bạn đã thay đổi biến GITHUB_USER và GITHUB_REPO trong mã nguồn, và kho chứa (Repository) của bạn đang ở chế độ Public.</i>
                </div>`;
        }

        async function fetchStories() {
            showLoading(true);
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                
                if (!response.ok) {
                    if (response.status === 404) throw new Error("Không tìm thấy Kho chứa (Repository). Bạn đã điền đúng tên chưa?");
                    if (response.status === 403) throw new Error("Bị giới hạn lượt truy cập API từ Github, vui lòng thử lại sau.");
                    throw new Error(`Mã lỗi: ${response.status}`);
                }

                const data = await response.json();
                
                // Lọc lấy các thư mục (loại bỏ các file ngoài cùng như README.md nếu có)
                const folders = data.filter(item => item.type === 'dir');
                renderHome(folders);

            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        async function fetchChapters(folderName) {
            showLoading(true);
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${encodeURIComponent(folderName)}`);
                
                if (!response.ok) throw new Error('Không thể lấy nội dung thư mục');

                const data = await response.json();
                const files = data.filter(item => item.type === 'file');
                renderStoryInfo(folderName, files);

            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        async function fetchFileContent(fileUrl, fileName, folderName) {
            showLoading(true);
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Không thể tải file nội dung');
                
                const text = await response.text();
                renderReading(fileName, text, folderName);
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        function renderHome(folders) {
            if (folders.length === 0) {
                appContainer.innerHTML = '<p style="text-align:center; margin-top:50px;">Chưa có tác phẩm nào được đăng tải.</p>';
                return;
            }

            let html = '<h2>Danh sách Tác Phẩm</h2><ul>';
            folders.forEach(folder => {
                html += `<li><a onclick="fetchChapters('${folder.name.replace(/'/g, "\\'")}')">${folder.name}</a></li>`;
            });
            html += '</ul>';

            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function renderStoryInfo(folderName, files) {
            let html = `<button class="back-btn" onclick="goHome()">← Trở về trang chủ</button>`;
            html += `<h2>${folderName}</h2>`;

            if (files.length === 0) {
                html += '<p>Tác phẩm này hiện chưa có chương nào.</p>';
            } else {
                html += '<ul>';
                files.forEach(file => {
                    html += `<li><a onclick="fetchFileContent('${file.download_url}', '${file.name.replace(/'/g, "\\'")}', '${folderName.replace(/'/g, "\\'")}')">${file.name.replace(/\.[^/.]+$/, "")}</a></li>`;
                });
                html += '</ul>';
            }

            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function renderReading(fileName, content, folderName) {
            let html = `<button class="back-btn" onclick="fetchChapters('${folderName.replace(/'/g, "\\'")}')">← Trở về danh sách chương</button>`;
            html += `<h2>${fileName.replace(/\.[^/.]+$/, "")}</h2>`;
            html += `<div class="content-box">${content}</div>`;
            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        window.goHome = function() {
            fetchStories();
        }

        // Bắt đầu khởi chạy trang web
        goHome();

    </script>
</body>
</html>
